{% extends 'basecanto.html' %}
{% load crispy_forms_tags %}
{% load tailwind_filters %}
    

{% block title %}
    Editar album vallenato
{% endblock title %}

{% block main %}
<br>
<h2 class="text-xl text-center font-semibold mb-4">Editar información de un album vallenato</h2>
<form  method="POST" enctype="multipart/form-data" action="{% url 'albumvallenato_edit' pk=object.pk %}">
    {% csrf_token %}
    <div>
        {{ form|crispy }}
    </div>
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
        
        <button type="submit" 
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline">
            Guardar cambios
        </button>
        

        <a class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline" href="{% url 'albumesvallenato_list' %}">Cancelar</a>
        </div>    
</form>

{% endblock main %}
