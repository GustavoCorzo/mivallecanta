{% extends 'basecanto.html' %}
{% load crispy_forms_tags %}
{% load tailwind_filters %}
{% block title %}
    Crear nueva versión de canto Vallenato
{% endblock title %}

{% block main %}
<div class="container mx-auto px-4 md:flex items-center gap-6 bg-gray-100 p-8">
    <div>
        <h3 class="text-2xl text-center font-bold mb-4">Crear nueva versión de canto Vallenato</h3>
        <form  method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div>
                {{ form|crispy }}
            </div>
            <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
                <button type="submit" 
                    class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline">
                    Guardar
                </button>    
                <a class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg" href="{% url 'versionesvallenato_list' %}">Volver al listado</a>
            </div>
        </form>
    </div>



</div>
{% endblock main %}
